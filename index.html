<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f7f3ed" />
    <title>Snepr | Know before you go</title>
    <meta
      name="description"
      content="Check live salon wait times, save your chair and walk straight in. SalonOS for salons, with no haircut commissions."
    />
    <link rel="icon" type="image/png" href="/snepr-logo.png" />
    <!-- Global & Buffer browser polyfill -->
    <script>
      window.global = window;
      if (typeof window.Buffer === "undefined") {
        window.Buffer = {
          isBuffer: function() { return false; },
          from: function(x) {
            if (typeof x === "string") return new TextEncoder().encode(x);
            return new Uint8Array(x || []);
          },
          alloc: function(n) { return new Uint8Array(n || 0); },
          allocUnsafe: function(n) { return new Uint8Array(n || 0); },
          concat: function(arr) {
            var total = (arr || []).reduce(function(acc, a) { return acc + (a ? a.length : 0); }, 0);
            var res = new Uint8Array(total);
            var off = 0;
            (arr || []).forEach(function(a) { if (a) { res.set(a, off); off += a.length; } });
            return res;
          },
          byteLength: function(str) { return new TextEncoder().encode(str || "").length; }
        };
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

  <body class="bg-[#f7f3ed] text-[#211914] antialiased">

    <script type="module" src="/src/main.tsx"></script>
  </body>

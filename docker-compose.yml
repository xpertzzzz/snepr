version: "3.8"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: snepr_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-snepr}
    ports:
      - "5432:5432"
    volumes:
      - snepr_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d snepr"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: snepr_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - snepr_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  snepr_pg_data:
  snepr_redis_data:
